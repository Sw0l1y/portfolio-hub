<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#162520"/>
      <stop offset="100%" stop-color="#050e09"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- dungeon room walls -->
  <rect x="60" y="50" width="480" height="300" rx="4" fill="none" stroke="#a0f0ff" stroke-width="1.5" opacity="0.25"/>
  <rect x="70" y="60" width="460" height="280" rx="2" fill="none" stroke="#a0f0ff" stroke-width="0.5" opacity="0.1"/>

  <!-- floor tiles -->
  <g stroke="#a0f0ff" stroke-width="0.3" opacity="0.08">
    <line x1="60" y1="90" x2="540" y2="90"/>
    <line x1="60" y1="130" x2="540" y2="130"/>
    <line x1="60" y1="170" x2="540" y2="170"/>
    <line x1="60" y1="210" x2="540" y2="210"/>
    <line x1="60" y1="250" x2="540" y2="250"/>
    <line x1="60" y1="290" x2="540" y2="290"/>
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="180" y1="50" x2="180" y2="350"/>
    <line x1="260" y1="50" x2="260" y2="350"/>
    <line x1="340" y1="50" x2="340" y2="350"/>
    <line x1="420" y1="50" x2="420" y2="350"/>
    <line x1="500" y1="50" x2="500" y2="350"/>
  </g>

  <!-- player (center) -->
  <circle cx="300" cy="200" r="14" fill="#a0f0ff" opacity="0.95" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="14" fill="#a0f0ff" opacity="0.7"/>
  <!-- XP ring -->
  <circle cx="300" cy="200" r="26" fill="none" stroke="#a0f0ff" stroke-width="2" opacity="0.5" stroke-dasharray="130 32"/>
  <!-- level badge -->
  <text x="296" y="204" font-family="monospace" font-size="10" fill="#091510" font-weight="bold">7</text>

  <!-- orbital weapon ring -->
  <circle cx="300" cy="200" r="55" fill="none" stroke="#a0f0ff" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.25"/>
  <circle cx="300" cy="145" r="7" fill="#a0f0ff" opacity="0.8"/>
  <circle cx="349" cy="232" r="7" fill="#a0f0ff" opacity="0.8"/>
  <circle cx="251" cy="232" r="7" fill="#a0f0ff" opacity="0.8"/>

  <!-- sword beam -->
  <line x1="300" y1="200" x2="380" y2="120" stroke="#a0f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <line x1="300" y1="200" x2="380" y2="120" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- bow beam -->
  <line x1="300" y1="200" x2="180" y2="100" stroke="#ff6600" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>

  <!-- enemies -->
  <circle cx="140" cy="120" r="9" fill="#ff6600" opacity="0.8"/>
  <circle cx="140" cy="120" r="14" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.4"/>
  <circle cx="460" cy="100" r="9" fill="#ff6600" opacity="0.8"/>
  <circle cx="460" cy="100" r="14" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.4"/>
  <circle cx="480" cy="290" r="9" fill="#ff6600" opacity="0.7"/>
  <circle cx="130" cy="300" r="9" fill="#ff6600" opacity="0.7"/>
  <circle cx="400" cy="310" r="7" fill="#ff6600" opacity="0.6"/>
  <circle cx="200" cy="290" r="7" fill="#ff6600" opacity="0.6"/>
  <circle cx="500" cy="200" r="11" fill="#ff6600" opacity="0.75"/>
  <circle cx="100" cy="200" r="8" fill="#ff6600" opacity="0.65"/>

  <!-- loot drop (chest) -->
  <rect x="370" y="270" width="18" height="14" rx="2" fill="#ffd700" opacity="0.6"/>
  <rect x="370" y="273" width="18" height="3" fill="#ffd700" opacity="0.8"/>

  <!-- XP bar (top) -->
  <rect x="60" y="30" width="320" height="6" rx="3" fill="#a0f0ff" opacity="0.1"/>
  <rect x="60" y="30" width="220" height="6" rx="3" fill="#a0f0ff" opacity="0.6"/>
  <text x="390" y="38" font-family="monospace" font-size="9" fill="#a0f0ff" opacity="0.7" letter-spacing="1">LVL 7 · XP 68%</text>

  <text x="20" y="380" font-family="monospace" font-size="9" fill="#a0f0ff" opacity="0.35" letter-spacing="1">REACT · CANVAS · TOP-DOWN COMBAT</text>
</svg>
