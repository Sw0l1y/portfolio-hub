<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1e2e"/>
      <stop offset="100%" stop-color="#030a12"/>
    </radialGradient>
    <radialGradient id="arena" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2240" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="200" rx="210" ry="160" fill="url(#arena)"/>

  <!-- arena border rings -->
  <circle cx="300" cy="200" r="180" fill="none" stroke="#74d2ff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="300" cy="200" r="160" fill="none" stroke="#74d2ff" stroke-width="0.5" opacity="0.15"/>

  <!-- arena grid lines -->
  <g stroke="#74d2ff" stroke-width="0.4" opacity="0.1">
    <line x1="120" y1="200" x2="480" y2="200"/>
    <line x1="300" y1="40" x2="300" y2="360"/>
    <line x1="173" y1="73" x2="427" y2="327"/>
    <line x1="427" y1="73" x2="173" y2="327"/>
  </g>

  <!-- slash arc -->
  <path d="M 260 155 Q 310 175 340 230" fill="none" stroke="#74d2ff" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#bloom)"/>
  <path d="M 258 153 Q 308 173 338 228" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- dash trail -->
  <rect x="195" y="194" width="70" height="12" rx="6" fill="#74d2ff" opacity="0.15"/>
  <rect x="220" y="196" width="42" height="8" rx="4" fill="#74d2ff" opacity="0.25"/>

  <!-- player (white circle) -->
  <circle cx="270" cy="200" r="12" fill="white" opacity="0.95" filter="url(#bloom)"/>
  <circle cx="270" cy="200" r="12" fill="white" opacity="0.9"/>
  <circle cx="270" cy="200" r="6" fill="#74d2ff" opacity="0.8"/>

  <!-- enemies -->
  <circle cx="380" cy="140" r="10" fill="#ff789f" opacity="0.85"/>
  <circle cx="380" cy="140" r="16" fill="none" stroke="#ff789f" stroke-width="1" opacity="0.4"/>
  <circle cx="420" cy="250" r="10" fill="#ff789f" opacity="0.85"/>
  <circle cx="420" cy="250" r="16" fill="none" stroke="#ff789f" stroke-width="1" opacity="0.4"/>
  <circle cx="190" cy="280" r="8" fill="#ff789f" opacity="0.7"/>
  <circle cx="350" cy="310" r="8" fill="#ff789f" opacity="0.65"/>
  <circle cx="155" cy="160" r="7" fill="#ff789f" opacity="0.55"/>

  <!-- cooldown rings (HUD) -->
  <circle cx="80" cy="340" r="22" fill="none" stroke="#74d2ff" stroke-width="2" opacity="0.3"/>
  <circle cx="80" cy="340" r="22" fill="none" stroke="#74d2ff" stroke-width="2" stroke-dasharray="110 28" opacity="0.7"/>
  <text x="72" y="344" font-family="monospace" font-size="9" fill="#74d2ff" opacity="0.8">DSH</text>
  <circle cx="130" cy="340" r="22" fill="none" stroke="#ff789f" stroke-width="2" opacity="0.3"/>
  <circle cx="130" cy="340" r="22" fill="none" stroke="#ff789f" stroke-width="2" stroke-dasharray="90 48" opacity="0.7"/>
  <text x="121" y="344" font-family="monospace" font-size="9" fill="#ff789f" opacity="0.8">ATK</text>

  <!-- round label -->
  <text x="480" y="40" font-family="monospace" font-size="10" fill="#74d2ff" opacity="0.6" text-anchor="end" letter-spacing="1">ROUND 04</text>
  <text x="20" y="380" font-family="monospace" font-size="9" fill="#74d2ff" opacity="0.35" letter-spacing="1">CANVAS · TOP-DOWN · ARENA</text>
</svg>
