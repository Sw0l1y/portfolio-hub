<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04040b"/>
      <stop offset="100%" stop-color="#070712"/>
    </linearGradient>

    <!-- Ball radial gradient -->
    <radialGradient id="ballgrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#b8f0ff"/>
      <stop offset="100%" stop-color="#30c8ff"/>
    </radialGradient>

    <!-- Ball glow -->
    <radialGradient id="ballglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Portal glow -->
    <radialGradient id="portalglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0"/>
    </radialGradient>

    <!-- Anchor glow -->
    <radialGradient id="anchorglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a060ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a060ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(30,30,80,0.5)" stroke-width="0.5">
    <line x1="55"  y1="0" x2="55"  y2="400"/>
    <line x1="110" y1="0" x2="110" y2="400"/>
    <line x1="165" y1="0" x2="165" y2="400"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="275" y1="0" x2="275" y2="400"/>
    <line x1="330" y1="0" x2="330" y2="400"/>
    <line x1="385" y1="0" x2="385" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="495" y1="0" x2="495" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="55"  x2="600" y2="55"/>
    <line x1="0" y1="110" x2="600" y2="110"/>
    <line x1="0" y1="165" x2="600" y2="165"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="275" x2="600" y2="275"/>
    <line x1="0" y1="330" x2="600" y2="330"/>
    <line x1="0" y1="385" x2="600" y2="385"/>
  </g>

  <!-- ── PLATFORMS ── -->
  <!-- Left platform -->
  <rect x="30"  y="300" width="180" height="80" fill="#0b0b1e"/>
  <rect x="31"  y="301" width="178" height="78" fill="none" stroke="#00bfff" stroke-width="1.8" opacity="0.9" filter="url(#glow)"/>
  <rect x="31"  y="301" width="178" height="78" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>

  <!-- Right platform -->
  <rect x="400" y="280" width="170" height="100" fill="#0b0b1e"/>
  <rect x="401" y="281" width="168" height="98" fill="none" stroke="#00bfff" stroke-width="1.8" opacity="0.9" filter="url(#glow)"/>
  <rect x="401" y="281" width="168" height="98" fill="none" stroke="#00bfff" stroke-width="1.5" opacity="0.7"/>

  <!-- ── ANCHOR ── -->
  <!-- Glow halo -->
  <circle cx="290" cy="72" r="36" fill="url(#anchorglow)"/>
  <!-- Outer ring -->
  <circle cx="290" cy="72" r="20" fill="none" stroke="rgba(160,96,255,0.45)" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Core -->
  <circle cx="290" cy="72" r="13" fill="#c080ff" filter="url(#glow)"/>
  <circle cx="290" cy="72" r="13" fill="#c080ff"/>
  <!-- Crosshair -->
  <line x1="278" y1="72" x2="302" y2="72" stroke="rgba(6,6,14,0.65)" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="60" x2="290" y2="84" stroke="rgba(6,6,14,0.65)" stroke-width="2" stroke-linecap="round"/>

  <!-- ── TETHER LINE ── -->
  <!-- Tether from ball (148, 285) to anchor (290, 72) — slightly taut, cyan fading to purple -->
  <defs>
    <linearGradient id="tethergrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c080ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <line x1="148" y1="285" x2="290" y2="72" stroke="url(#tethergrad)" stroke-width="2" filter="url(#glow)"/>
  <line x1="148" y1="285" x2="290" y2="72" stroke="url(#tethergrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- ── BALL TRAIL ── -->
  <circle cx="115" cy="294" r="5"  fill="#00c8ff" opacity="0.07"/>
  <circle cx="122" cy="291" r="6"  fill="#00c8ff" opacity="0.10"/>
  <circle cx="130" cy="289" r="7"  fill="#00c8ff" opacity="0.13"/>
  <circle cx="138" cy="287" r="8"  fill="#00c8ff" opacity="0.16"/>

  <!-- Ball glow halo -->
  <circle cx="148" cy="285" r="38" fill="url(#ballglow)"/>
  <!-- Ball -->
  <circle cx="148" cy="285" r="18" fill="url(#ballgrad)" filter="url(#softglow)"/>
  <circle cx="148" cy="285" r="18" fill="url(#ballgrad)"/>
  <!-- Spin line -->
  <line x1="133" y1="285" x2="163" y2="285" stroke="rgba(0,60,100,0.45)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── PORTAL ── -->
  <!-- Outer glow -->
  <circle cx="485" cy="256" r="52" fill="url(#portalglow)"/>
  <!-- Rotating arc segments (6 evenly spaced) -->
  <g filter="url(#glow)" stroke="#00ffaa" stroke-width="3.5" fill="none" opacity="0.88">
    <path d="M 485 232 A 24 24 0 0 1 506 268"/>
    <path d="M 497 281 A 24 24 0 0 1 462 278"/>
    <path d="M 466 242 A 24 24 0 0 1 481 232"/>
  </g>
  <g stroke="#00ffaa" stroke-width="2.5" fill="none" opacity="0.65">
    <path d="M 485 232 A 24 24 0 0 1 506 268"/>
    <path d="M 497 281 A 24 24 0 0 1 462 278"/>
    <path d="M 466 242 A 24 24 0 0 1 481 232"/>
  </g>
  <!-- Center dot -->
  <circle cx="485" cy="256" r="6" fill="#00ffaa" filter="url(#glow)"/>
  <circle cx="485" cy="256" r="6" fill="#00ffaa"/>

  <!-- ── AMBIENT PARTICLES ── -->
  <circle cx="320" cy="170" r="2"   fill="#00e5ff" opacity="0.22"/>
  <circle cx="200" cy="200" r="1.5" fill="#a060ff" opacity="0.28"/>
  <circle cx="380" cy="140" r="1.5" fill="#00e5ff" opacity="0.18"/>
  <circle cx="88"  cy="180" r="1"   fill="#00e5ff" opacity="0.20"/>
  <circle cx="540" cy="180" r="1.5" fill="#00ffaa" opacity="0.22"/>
  <circle cx="430" cy="210" r="1"   fill="#00ffaa" opacity="0.20"/>

  <!-- ── HUD LABELS ── -->
  <text x="30" y="18" font-family="monospace" font-size="10" fill="rgba(0,229,255,0.45)" letter-spacing="1">LEVEL 1 / 5</text>
  <text x="570" y="395" font-family="monospace" font-size="9" fill="rgba(0,229,255,0.22)" text-anchor="end" letter-spacing="0.5">PHYSICS · TETHER · PENDULUM</text>
</svg>
