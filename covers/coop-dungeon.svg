<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#120c22"/>
      <stop offset="100%" stop-color="#06040e"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8855ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8855ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strong-glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow-center)"/>

  <!-- Grid floor -->
  <g stroke="#3a2266" stroke-width="0.6" opacity="0.5">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
  </g>

  <!-- Room walls -->
  <rect x="60" y="44" width="480" height="312" rx="3" fill="none" stroke="#5533aa" stroke-width="2" opacity="0.5"/>

  <!-- Door openings -->
  <rect x="272" y="44" width="56" height="8" fill="#06040e"/>
  <rect x="272" y="348" width="56" height="8" fill="#06040e"/>
  <rect x="60" y="168" width="8" height="64" fill="#06040e"/>
  <rect x="532" y="168" width="8" height="64" fill="#06040e"/>

  <!-- Door glows -->
  <rect x="272" y="40" width="56" height="14" rx="2" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.7" filter="url(#soft-glow)"/>
  <rect x="532" y="166" width="16" height="68" rx="2" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.7" filter="url(#soft-glow)"/>

  <!-- Player tokens -->
  <!-- Knight (blue) -->
  <rect x="198" y="178" width="22" height="22" rx="4" fill="#2255cc" filter="url(#soft-glow)"/>
  <rect x="198" y="178" width="22" height="22" rx="4" fill="none" stroke="#88aaff" stroke-width="1.5"/>
  <!-- Ranger (green) -->
  <rect x="238" y="192" width="22" height="22" rx="4" fill="#226633" filter="url(#soft-glow)"/>
  <rect x="238" y="192" width="22" height="22" rx="4" fill="none" stroke="#66ee88" stroke-width="1.5"/>
  <!-- Mage (purple) -->
  <rect x="222" y="160" width="22" height="22" rx="4" fill="#662299" filter="url(#soft-glow)"/>
  <rect x="222" y="160" width="22" height="22" rx="4" fill="none" stroke="#cc88ff" stroke-width="1.5"/>
  <!-- Rogue (red) -->
  <rect x="258" y="172" width="22" height="22" rx="4" fill="#aa2233" filter="url(#soft-glow)"/>
  <rect x="258" y="172" width="22" height="22" rx="4" fill="none" stroke="#ff7788" stroke-width="1.5"/>

  <!-- Enemy tokens -->
  <circle cx="380" cy="185" r="11" fill="#cc5511" filter="url(#soft-glow)"/>
  <circle cx="380" cy="185" r="11" fill="none" stroke="#ff8844" stroke-width="1.5"/>
  <circle cx="420" cy="210" r="11" fill="#991199" filter="url(#soft-glow)"/>
  <circle cx="420" cy="210" r="11" fill="none" stroke="#ff44ff" stroke-width="1.5"/>
  <circle cx="400" cy="158" r="11" fill="#117799" filter="url(#soft-glow)"/>
  <circle cx="400" cy="158" r="11" fill="none" stroke="#44ccff" stroke-width="1.5"/>

  <!-- Projectile trail from mage -->
  <line x1="244" y1="171" x2="370" y2="183" stroke="#cc66ff" stroke-width="2" opacity="0.7" filter="url(#soft-glow)"/>
  <circle cx="368" cy="183" r="5" fill="#cc66ff" opacity="0.9" filter="url(#strong-glow)"/>

  <!-- Ripple from projectile impact -->
  <circle cx="385" cy="185" r="18" fill="none" stroke="#8855ff" stroke-width="1" opacity="0.4"/>
  <circle cx="385" cy="185" r="28" fill="none" stroke="#8855ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Item pickup -->
  <polygon points="460,260 468,266 465,276 455,276 452,266" fill="#ffcc00" opacity="0.9" filter="url(#soft-glow)"/>

  <!-- HP bars above players -->
  <rect x="196" y="174" width="26" height="3" rx="1" fill="#220000" opacity="0.8"/>
  <rect x="196" y="174" width="22" height="3" rx="1" fill="#44dd44" opacity="0.85"/>
  <rect x="236" y="188" width="26" height="3" rx="1" fill="#220000" opacity="0.8"/>
  <rect x="236" y="188" width="18" height="3" rx="1" fill="#ddaa22" opacity="0.85"/>

  <!-- Title -->
  <text x="300" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
        fill="#8855ff" opacity="0.6" text-anchor="middle" letter-spacing="4">CO-OP DUNGEON</text>

  <!-- Corner accents -->
  <rect x="60" y="44" width="16" height="16" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="524" y="44" width="16" height="16" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="60" y="340" width="16" height="16" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="524" y="340" width="16" height="16" fill="none" stroke="#8855ff" stroke-width="1.5" opacity="0.6"/>
</svg>
