<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="30%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#0e2235"/>
      <stop offset="100%" stop-color="#030a12"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- speed trail lines -->
  <g stroke="#7df6ef" opacity="0.18">
    <line x1="0" y1="220" x2="480" y2="220" stroke-width="12"/>
    <line x1="0" y1="210" x2="380" y2="210" stroke-width="5"/>
    <line x1="0" y1="232" x2="340" y2="232" stroke-width="3"/>
    <line x1="0" y1="200" x2="260" y2="200" stroke-width="2"/>
    <line x1="0" y1="240" x2="200" y2="240" stroke-width="2"/>
  </g>

  <!-- platforms -->
  <rect x="0" y="240" width="200" height="12" rx="2" fill="#7df6ef" opacity="0.25"/>
  <rect x="240" y="200" width="160" height="12" rx="2" fill="#7df6ef" opacity="0.25"/>
  <rect x="440" y="170" width="160" height="12" rx="2" fill="#7df6ef" opacity="0.25"/>
  <rect x="60" y="310" width="120" height="12" rx="2" fill="#7df6ef" opacity="0.15"/>
  <rect x="340" y="290" width="100" height="12" rx="2" fill="#7df6ef" opacity="0.15"/>
  <rect x="490" y="270" width="110" height="12" rx="2" fill="#7df6ef" opacity="0.15"/>

  <!-- player character -->
  <rect x="204" y="176" width="18" height="24" rx="2" fill="#7df6ef" opacity="0.9"/>
  <circle cx="213" cy="169" r="9" fill="#7df6ef" opacity="0.9"/>
  <!-- motion blur trail -->
  <rect x="150" y="178" width="52" height="22" rx="2" fill="#7df6ef" opacity="0.12"/>
  <rect x="100" y="179" width="48" height="20" rx="2" fill="#7df6ef" opacity="0.06"/>

  <!-- checkpoint flag -->
  <line x1="442" y1="100" x2="442" y2="172" stroke="#ffd47d" stroke-width="2" opacity="0.8"/>
  <polygon points="442,100 472,112 442,124" fill="#ffd47d" opacity="0.8"/>

  <!-- jump arc (dotted) -->
  <path d="M 213 188 Q 340 100 442 158" fill="none" stroke="#7df6ef" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- HUD elements -->
  <text x="20" y="40" font-family="monospace" font-size="11" fill="#7df6ef" opacity="0.7" letter-spacing="1">TIME  00:42.31</text>
  <rect x="20" y="50" width="80" height="4" rx="2" fill="#7df6ef" opacity="0.15"/>
  <rect x="20" y="50" width="58" height="4" rx="2" fill="#7df6ef" opacity="0.5"/>
  <text x="20" y="75" font-family="monospace" font-size="9" fill="#ffd47d" opacity="0.6" letter-spacing="1">CHECKPOINT ✓</text>

  <text x="20" y="380" font-family="monospace" font-size="9" fill="#7df6ef" opacity="0.35" letter-spacing="1">CANVAS · JSON LEVELS · LOCAL SAVE</text>
</svg>
