<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8d6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="200" rx="220" ry="180" fill="url(#burst)"/>

  <!-- burst lines radiating -->
  <g stroke="#b8d6ff" stroke-linecap="round" filter="url(#glow)">
    <line x1="300" y1="200" x2="300" y2="60"  stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="200" x2="300" y2="340" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="200" x2="140" y2="200" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="200" x2="460" y2="200" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="200" x2="187" y2="87"  stroke-width="0.8" opacity="0.4"/>
    <line x1="300" y1="200" x2="413" y2="87"  stroke-width="0.8" opacity="0.4"/>
    <line x1="300" y1="200" x2="187" y2="313" stroke-width="0.8" opacity="0.4"/>
    <line x1="300" y1="200" x2="413" y2="313" stroke-width="0.8" opacity="0.4"/>
    <line x1="300" y1="200" x2="255" y2="72"  stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="345" y2="72"  stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="115" y2="145" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="485" y2="145" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="115" y2="255" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="485" y2="255" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- click target (big hexagonal button) -->
  <circle cx="300" cy="200" r="62" fill="#060610" stroke="#7ca7ff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="300" cy="200" r="50" fill="#0a0a1a" stroke="#b8d6ff" stroke-width="2.5" opacity="0.9"/>
  <circle cx="300" cy="200" r="38" fill="#0e0e24" stroke="#b8d6ff" stroke-width="1" opacity="0.5"/>
  <text x="300" y="207" font-family="monospace" font-size="14" font-weight="bold" fill="#b8d6ff" text-anchor="middle" opacity="0.9">CLICK</text>

  <!-- big counter -->
  <text x="300" y="105" font-family="monospace" font-size="36" font-weight="bold" fill="#b8d6ff" text-anchor="middle" opacity="0.9" filter="url(#glow)">847.3M</text>
  <text x="300" y="125" font-family="monospace" font-size="11" fill="#7ca7ff" text-anchor="middle" opacity="0.6" letter-spacing="2">COOKIES</text>

  <!-- floating +1 numbers -->
  <text x="360" y="155" font-family="monospace" font-size="14" fill="#b8d6ff" opacity="0.7">+1</text>
  <text x="240" y="140" font-family="monospace" font-size="11" fill="#b8d6ff" opacity="0.5">+1</text>
  <text x="390" y="180" font-family="monospace" font-size="10" fill="#b8d6ff" opacity="0.4">+1</text>

  <!-- upgrade sidebar (right) -->
  <rect x="490" y="60" width="90" height="260" rx="3" fill="#08081a" stroke="#7ca7ff" stroke-width="1" opacity="0.6"/>
  <text x="535" y="82" font-family="monospace" font-size="8" fill="#7ca7ff" text-anchor="middle" opacity="0.7" letter-spacing="1">UPGRADES</text>
  <rect x="498" y="88" width="74" height="20" rx="2" fill="#7ca7ff" opacity="0.15"/>
  <text x="535" y="102" font-family="monospace" font-size="8" fill="#b8d6ff" text-anchor="middle" opacity="0.8">AUTO-CLICK</text>
  <rect x="498" y="116" width="74" height="20" rx="2" fill="#7ca7ff" opacity="0.1"/>
  <text x="535" y="130" font-family="monospace" font-size="8" fill="#b8d6ff" text-anchor="middle" opacity="0.6">MULTIPLIER</text>
  <rect x="498" y="144" width="74" height="20" rx="2" fill="#7ca7ff" opacity="0.08"/>
  <rect x="498" y="172" width="74" height="20" rx="2" fill="#7ca7ff" opacity="0.06"/>
  <rect x="498" y="200" width="74" height="20" rx="2" fill="#7ca7ff" opacity="0.05"/>
  <!-- prestige button -->
  <rect x="498" y="290" width="74" height="22" rx="2" fill="#b8d6ff" opacity="0.9"/>
  <text x="535" y="305" font-family="monospace" font-size="8" fill="#000" text-anchor="middle" font-weight="bold">PRESTIGE</text>

  <!-- cps label -->
  <text x="20" y="40" font-family="monospace" font-size="10" fill="#7ca7ff" opacity="0.7" letter-spacing="1">12.4M COOKIES/SEC</text>
  <text x="20" y="380" font-family="monospace" font-size="9" fill="#b8d6ff" opacity="0.35" letter-spacing="1">VANILLA JS · SAVE EXPORT / IMPORT</text>
</svg>
