<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#142b0e"/>
      <stop offset="100%" stop-color="#040804"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- floor grid -->
  <g stroke="#a8ee72" stroke-width="0.4" opacity="0.15">
    <line x1="0" y1="340" x2="600" y2="340"/>
    <line x1="100" y1="400" x2="300" y2="280"/><line x1="200" y1="400" x2="300" y2="280"/>
    <line x1="300" y1="400" x2="300" y2="280"/><line x1="400" y1="400" x2="300" y2="280"/>
    <line x1="500" y1="400" x2="300" y2="280"/><line x1="0" y1="400" x2="300" y2="280"/>
    <line x1="600" y1="400" x2="300" y2="280"/>
    <line x1="0" y1="370" x2="600" y2="330"/><line x1="0" y1="400" x2="600" y2="360"/>
  </g>

  <!-- large isometric crate (center-left) -->
  <g filter="url(#glow)">
    <polygon points="210,160 280,130 350,160 280,190" fill="none" stroke="#a8ee72" stroke-width="1.5" opacity="0.9"/>
    <polygon points="210,160 210,230 280,260 280,190" fill="#0e2a0a" stroke="#a8ee72" stroke-width="1.5" opacity="0.9"/>
    <polygon points="350,160 350,230 280,260 280,190" fill="#142e10" stroke="#a8ee72" stroke-width="1.5" opacity="0.9"/>
    <line x1="245" y1="144" x2="245" y2="214" stroke="#a8ee72" stroke-width="0.5" opacity="0.4"/>
    <line x1="315" y1="144" x2="315" y2="214" stroke="#a8ee72" stroke-width="0.5" opacity="0.4"/>
    <line x1="210" y1="195" x2="280" y2="225" stroke="#a8ee72" stroke-width="0.5" opacity="0.4"/>
    <line x1="350" y1="195" x2="280" y2="225" stroke="#a8ee72" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- smaller crate (right) -->
  <g opacity="0.7">
    <polygon points="390,200 430,184 470,200 430,216" fill="none" stroke="#a8ee72" stroke-width="1.2"/>
    <polygon points="390,200 390,240 430,256 430,216" fill="#0d240a" stroke="#a8ee72" stroke-width="1.2"/>
    <polygon points="470,200 470,240 430,256 430,216" fill="#112a0d" stroke="#a8ee72" stroke-width="1.2"/>
  </g>

  <!-- sphere (floating) -->
  <circle cx="430" cy="130" r="38" fill="#0f2a0a" stroke="#a8ee72" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="430" cy="130" rx="38" ry="12" fill="none" stroke="#a8ee72" stroke-width="0.8" opacity="0.5"/>
  <line x1="392" y1="130" x2="468" y2="130" stroke="#a8ee72" stroke-width="0.6" opacity="0.4"/>
  <circle cx="418" cy="118" r="6" fill="#a8ee72" opacity="0.6"/>

  <!-- grapple line -->
  <line x1="120" y1="60" x2="280" y2="190" stroke="#ffde6e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <circle cx="120" cy="60" r="5" fill="#ffde6e" opacity="0.8"/>

  <!-- small prop crates -->
  <rect x="100" y="270" width="32" height="32" fill="none" stroke="#a8ee72" stroke-width="1" opacity="0.4"/>
  <rect x="108" y="278" width="16" height="16" fill="#a8ee72" opacity="0.08"/>
  <rect x="490" y="290" width="24" height="24" fill="none" stroke="#a8ee72" stroke-width="1" opacity="0.3"/>

  <!-- player silhouette -->
  <rect x="152" y="250" width="14" height="22" rx="2" fill="#a8ee72" opacity="0.6"/>
  <circle cx="159" cy="243" r="7" fill="#a8ee72" opacity="0.6"/>

  <!-- label -->
  <text x="20" y="30" font-family="monospace" font-size="10" fill="#a8ee72" opacity="0.5" letter-spacing="2">MULTIPLAYER · PHYSICS · BROWSER</text>
  <text x="20" y="380" font-family="monospace" font-size="9" fill="#a8ee72" opacity="0.35" letter-spacing="1">GODOT 4 · WEBRTC · WEBGL</text>
</svg>
